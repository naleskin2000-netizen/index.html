<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RubUp Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #191d2e; --card: #252736; --accent: #0098ea; --text: #fff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card); }
        .logo { font-size: 24px; font-weight: 900; font-style: italic; color: #fca311; }
        .balance { background: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .roulette-container { position: relative; width: 100%; height: 200px; background: var(--card); margin: 20px 0; overflow: hidden; display: flex; align-items: center; border-top: 2px solid #333; border-bottom: 2px solid #333; }
        .roulette-track { display: flex; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .item { min-width: 130px; height: 170px; margin: 0 10px; background: #2a2c3d; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #444; }
        .item img { width: 80px; height: 80px; }
        
        .indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #fca311; z-index: 10; box-shadow: 0 0 10px #fca311; }
        .indicator::before, .indicator::after { content: ''; position: absolute; left: -6px; border-left: 8px solid transparent; border-right: 8px solid transparent; }
        .indicator::before { top: 0; border-top: 10px solid #fca311; }
        .indicator::after { bottom: 0; border-bottom: 10px solid #fca311; }

        .btn { width: 90%; margin: 0 auto; padding: 15px; background: var(--accent); border: none; border-radius: 10px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #555; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">RubUP</div>
        <div class="balance"><span>⭐</span> <span id="user-balance">0</span></div>
    </div>

    <div class="roulette-container">
        <div class="indicator"></div>
        <div class="roulette-track" id="track"></div>
    </div>

    <button class="btn" id="openBtn" onclick="spin()">Открыть кейс (100 ⭐)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // В реальности баланс должен подгружаться с сервера. 
        // Пока ставим заглушку для теста.
        document.getElementById('user-balance').innerText = "1000"; 

        const items = [
            { name: "Sleigh Bell", img: "https://i.imgur.com/1.png", weight: 60 },
            { name: "Snoop Cigar", img: "https://i.imgur.com/2.png", weight: 30 },
            { name: "Death Note", img: "https://i.imgur.com/3.png", weight: 8 },
            { name: "Precious Peach", img: "https://i.imgur.com/4.png", weight: 2 }
        ];

        function generateTrack() {
            const track = document.getElementById('track');
            let html = '';
            for(let i=0; i<50; i++) {
                const r = items[Math.floor(Math.random() * items.length)];
                // Используем заглушки картинок (пока без ваших картинок)
                html += `<div class="item" style="background:#333;color:#fff;font-size:12px;text-align:center;">${r.name}</div>`;
            }
            track.innerHTML = html;
        }

        generateTrack();

        function spin() {
            const btn = document.getElementById('openBtn');
            btn.disabled = true;
            btn.innerText = "Открываем...";

            // Имитация запроса к серверу
            const winnerIndex = Math.floor(Math.random() * 50);
            const track = document.getElementById('track');
            const itemWidth = 150; 
            const containerWidth = document.querySelector('.roulette-container').offsetWidth;
            const centerOffset = (containerWidth / 2) - (itemWidth / 2);
            
            const offset = (winnerIndex * itemWidth) - centerOffset;
            track.style.transform = `translateX(-${offset}px)`;

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "Открыть кейс (100 ⭐)";
                const wonItem = items[Math.floor(Math.random() * items.length)]; 
                alert(`🎉 Вы выиграли: ${wonItem.name}!`);
                
                setTimeout(() => {
                    track.style.transition = 'none';
                    track.style.transform = 'translateX(0)';
                    generateTrack();
                }, 1000);
            }, 3100);
        }
    </script>
</body>
</html>
