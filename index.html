<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RubUP Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #161822; --card: #212330; --accent: #6b5bff; --text: #ffffff; --gold: #ffb703; --nav-bg: rgba(33, 35, 48, 0.98); --border: #2a2c3d; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg); z-index: 10; }
        .logo { font-size: 24px; font-weight: 900; font-style: italic; color: #fff; }
        .logo span { color: var(--gold); }
        .balance { background: var(--card); padding: 6px 12px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); color: var(--gold); }
        .balance span { color: #fff; }

        .content { flex: 1; overflow-y: auto; padding: 0 16px 100px 16px; }
        .tab { display: none; }
        .tab.active { display: block; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); position: relative; height: 190px; justify-content: flex-end; padding: 12px; cursor: pointer; }
        .card-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background-size: cover; background-position: center; }
        .card-name { font-size: 16px; font-weight: 800; z-index: 2; text-shadow: 0 2px 4px #000; }
        .case-price { position: absolute; bottom: 12px; right: 12px; background: var(--accent); padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 13px; z-index: 2; }

        .game-screen { display: none; flex-direction: column; height: 100%; padding: 20px; background: var(--bg); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; }
        .game-screen.active { display: flex; }
        
        .roulette-container { position: relative; width: 100%; height: 220px; background: #1a1c29; border-radius: 15px; margin: 20px 0; overflow: hidden; display: flex; align-items: center; border: 1px solid #333; }
        .roulette-track { display: flex; transition: transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .roulette-item { min-width: 120px; height: 160px; margin: 0 10px; background: #252736; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #444; }
        .roulette-item img { width: 80px; height: 80px; object-fit: contain; }
        
        .indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: var(--gold); z-index: 10; box-shadow: 0 0 10px var(--gold); }
        .indicator::before, .indicator::after { content: ''; position: absolute; left: -6px; border-left: 8px solid transparent; border-right: 8px solid transparent; }
        .indicator::before { top: 0; border-top: 10px solid var(--gold); }
        .indicator::after { bottom: 0; border-bottom: 10px solid var(--gold); }

        .btn-play { width: 100%; padding: 18px; background: linear-gradient(90deg, #5a4bff, #7b6cff); border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-play:disabled { background: #555; }
        .back-btn { background: none; border: none; color: #888; font-size: 16px; margin-bottom: 10px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Rub<span>UP</span></div>
        <div class="balance">⭐ <span id="balance">...</span></div>
    </div>

    <div class="content" id="main-content">
        <div id="tab-cases" class="tab active">
            <div style="font-size: 22px; font-weight: 800; margin: 15px 0 10px 0;">Кейсы</div>
            <div class="grid">
                <!-- Укажи свои картинки вместо img/case1.webp -->
                <div class="card" onclick="startGame('Шляпы', 100)">
                    <div class="card-bg" style="background-image: url('img/case1.webp');"></div>
                    <div class="card-name">Шляпы</div>
                    <div class="case-price">100 ⭐</div>
                </div>
                <div class="card" onclick="startGame('Медведи', 150)">
                    <div class="card-bg" style="background-image: url('img/case2.webp');"></div>
                    <div class="card-name">Медведи</div>
                    <div class="case-price">150 ⭐</div>
                </div>
                <div class="card" onclick="startGame('Сладости', 200)">
                    <div class="card-bg" style="background-image: url('img/case3.webp');"></div>
                    <div class="card-name">Сладости</div>
                    <div class="case-price">200 ⭐</div>
                </div>
                <div class="card" onclick="startGame('Роза', 300)">
                    <div class="card-bg" style="background-image: url('img/case4.webp');"></div>
                    <div class="card-name">Роза</div>
                    <div class="case-price">300 ⭐</div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="game-screen">
        <button class="back-btn" onclick="closeGame()">← Назад</button>
        <div style="text-align: center; font-size: 24px; font-weight: 900;" id="game-title">Название кейса</div>
        
        <div class="roulette-container">
            <div class="indicator"></div>
            <div class="roulette-track" id="track"></div>
        </div>

        <button class="btn-play" id="spin-btn" onclick="spin()">Открыть кейс</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ВАЖНО: Ссылка на твой сервер Render (без слэша на конце)
        const API_URL = "https://robup-bot.onrender.com"; 
        const userId = tg.initDataUnsafe?.user?.id;

        let currentBalance = 0;
        let currentCost = 0;

        // Загружаем баланс при старте
        async function loadBalance() {
            if(!userId) return;
            try {
                const res = await fetch(`${API_URL}/api/balance?user_id=${userId}`);
                const data = await res.json();
                currentBalance = data.balance;
                document.getElementById('balance').innerText = currentBalance;
            } catch (e) {
                console.log("Ошибка сети", e);
            }
        }

        loadBalance();

        const items = [
            { name: "Предмет 1", img: "img/case1.webp" },
            { name: "Предмет 2", img: "img/case2.webp" },
            { name: "Предмет 3", img: "img/case3.webp" },
            { name: "Предмет 4", img: "img/case4.webp" }
        ];

        function startGame(caseName, cost) {
            currentCost = cost;
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('game-title').innerText = caseName;
            document.getElementById('spin-btn').innerText = `Открыть за ${cost} ⭐`;
            generateTrack();
        }

        function closeGame() {
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('game-screen').classList.remove('active');
            loadBalance(); // Обновляем баланс при выходе
        }

        function generateTrack() {
            const track = document.getElementById('track');
            let html = '';
            for(let i=0; i<50; i++) {
                const r = items[Math.floor(Math.random() * items.length)];
                html += `<div class="roulette-item"><img src="${r.img}" onerror="this.src='https://via.placeholder.com/80?text=?'"></div>`;
            }
            track.innerHTML = html;
        }

        async function spin() {
            if(!userId) return tg.showAlert("Ошибка: Нет ID");
            
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            btn.innerText = "Крутим...";

            // Отправляем запрос боту на списание звезд
            try {
                const res = await fetch(`${API_URL}/api/play`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, cost: currentCost })
                });
                const data = await res.json();
                
                if(!data.success) {
                    btn.disabled = false;
                    btn.innerText = `Открыть за ${currentCost} ⭐`;
                    return tg.showAlert(data.msg);
                }

                // Баланс обновился
                currentBalance = data.balance;
                document.getElementById('balance').innerText = currentBalance;

                // Запускаем анимацию
                const winnerIndex = Math.floor(Math.random() * 50);
                const track = document.getElementById('track');
                const itemWidth = 140; 
                const containerWidth = document.querySelector('.roulette-container').offsetWidth;
                const centerOffset = (containerWidth / 2) - (itemWidth / 2);
                const offset = (winnerIndex * itemWidth) - centerOffset;
                
                track.style.transform = `translateX(-${offset}px)`;

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = `Открыть за ${currentCost} ⭐`;
                    const wonItem = items[Math.floor(Math.random() * items.length)]; 
                    tg.showAlert(`🎉 Вы выиграли: ${wonItem.name}!`);
                    
                    setTimeout(() => {
                        track.style.transition = 'none';
                        track.style.transform = 'translateX(0)';
                        generateTrack();
                    }, 1000);
                }, 3600);

            } catch (e) {
                btn.disabled = false;
                btn.innerText = `Открыть за ${currentCost} ⭐`;
                tg.showAlert("Ошибка сервера. Попробуйте позже.");
            }
        }
    </script>
</body>
</html>
